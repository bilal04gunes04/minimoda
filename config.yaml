# ============================================================
# Binance Trade Botu - Yapilandirma (scalping modu)
# ============================================================

# true  -> Binance TESTNET kullanilir (sahte para, guvenli)
# false -> GERCEK Binance hesabi kullanilir (DIKKAT!)
testnet: true

# true  -> Emirler borsaya GONDERILMEZ, sadece simule edilir (kagit islem)
# false -> Emirler gercekten gonderilir
dry_run: true

# Islem ciftleri (coklu coin destegi) ve mum araligi
symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
interval: 1m         # 1m, 5m, 15m, 1h, 4h, 1d ...

# Strateji parametreleri
strategy:
  ema_fast: 9        # hizli EMA periyodu
  ema_slow: 21       # yavas EMA periyodu
  rsi_period: 14
  rsi_oversold: 30   # RSI bu degerin altindaysa asiri satim (alim firsati)
  rsi_overbought: 70 # RSI bu degerin ustundeyse asiri alim (satis sinyali)

# Islem basi risk yonetimi (kucuk ve sik islemler)
risk:
  quote_per_trade: 100.0     # her islemde kullanilacak USDT miktari (kucuk tutun)
  max_open_positions: 2      # tum coinlerde ayni anda toplam acik pozisyon
  stop_loss_pct: 0.5         # % sabit zarar durdur (islem basina)
  take_profit_pct: 0.0       # % sabit kar al (0 = kapali, trailing stop kullanilir)
  trailing_activation_pct: 0.4  # kar bu yuzdeye ulasinca trailing stop devreye girer
  trailing_stop_pct: 0.3        # tepe fiyattan bu kadar dusunce satilir (0 = kapali)

# Gunluk hedef ve koruma
# NOT: profit_target_pct bir HEDEF/DURDURMA esigidir, kazanc garantisi degildir.
# Bot hedefe ulasirsa o gun yeni islem acmaz; zarar limiti asilirsa da durur.
daily:
  capital: 1000.0          # ana paraniz (USDT)
  profit_target_pct: 10.0  # gunluk kar hedefi: ana paranin %10'u -> ulasilinca durur
  max_loss_pct: 3.0        # gunluk zarar limiti: ana paranin %3'u -> asilirsa durur

# AL sinyali onay filtreleri
# Filtreler sinyal uretmez; stratejinin AL sinyalini dogrular.
# Herhangi biri "hayir" derse islem acilmaz. Tumu ucretsiz API kullanir.
filters:
  volume:                  # 1) Hacim onayi: dusuk hacimli sahte kesisimleri eler
    enabled: true
    lookback: 20           # ortalama icin bakilacak mum sayisi
    min_ratio: 1.2         # son mum hacmi ortalamanin en az bu kati olmali
  orderbook:               # 2) Emir defteri: alis tarafi agir degilse alim yapma
    enabled: true
    depth: 50              # okunacak seviye sayisi
    min_bid_ratio: 0.55    # alis hacminin toplam icindeki asgari payi
  fear_greed:              # 3) Piyasa rejimi: asiri korku/acgozlulukte alim yapma
    enabled: true
    min_value: 20          # endeks bunun altindaysa (panik) bekle
    max_value: 85          # endeks bunun ustundeyse (balon) bekle
  whale:                   # 4) Balina akisi: buyuk emirlerde satis baskisi varsa bekle
    enabled: true
    min_trade_usdt: 50000  # bu tutar ustu emirler "buyuk" sayilir
    max_sell_ratio: 0.65   # buyuk emirlerde satis orani bunu asarsa alim yapma

# Telegram kontrol paneli
# Acmak icin: enabled: true yapin ve .env dosyasina
# TELEGRAM_BOT_TOKEN ile TELEGRAM_CHAT_ID ekleyin (README'de anlatiliyor)
telegram:
  enabled: false

# Dongu bekleme suresi (saniye) - 1m mumlar icin kisa
poll_seconds: 15
