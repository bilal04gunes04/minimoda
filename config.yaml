# ============================================================
# Binance Trade Botu - Yapilandirma (scalping modu)
# ============================================================

# true  -> Binance TESTNET kullanilir (sahte para, guvenli)
# false -> GERCEK Binance hesabi kullanilir (DIKKAT!)
testnet: true

# true  -> Emirler borsaya GONDERILMEZ, sadece simule edilir (kagit islem)
# false -> Emirler gercekten gonderilir
dry_run: true

# Islem cifti ve mum araligi (scalping icin kisa aralik)
symbol: BTCUSDT
interval: 5m         # 1m, 5m, 15m, 1h, 4h, 1d ...

# Strateji parametreleri
strategy:
  ema_fast: 9        # hizli EMA periyodu
  ema_slow: 21       # yavas EMA periyodu
  rsi_period: 14
  rsi_oversold: 30   # RSI bu degerin altindaysa asiri satim (alim firsati)
  rsi_overbought: 70 # RSI bu degerin ustundeyse asiri alim (satis sinyali)

# Islem basi risk yonetimi (kucuk ve sik islemler)
risk:
  quote_per_trade: 100.0   # her islemde kullanilacak USDT miktari (kucuk tutun)
  max_open_positions: 1    # ayni anda acik pozisyon sayisi
  stop_loss_pct: 0.5       # % zarar durdur (islem basina)
  take_profit_pct: 0.8     # % kar al (islem basina)

# Gunluk hedef ve koruma
# NOT: profit_target_pct bir HEDEF/DURDURMA esigidir, kazanc garantisi degildir.
# Bot hedefe ulasirsa o gun yeni islem acmaz; zarar limiti asilirsa da durur.
daily:
  capital: 1000.0          # ana paraniz (USDT)
  profit_target_pct: 10.0  # gunluk kar hedefi: ana paranin %10'u -> ulasilinca durur
  max_loss_pct: 3.0        # gunluk zarar limiti: ana paranin %3'u -> asilirsa durur

# Dongu bekleme suresi (saniye) - scalping icin kisa
poll_seconds: 20
